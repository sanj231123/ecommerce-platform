apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth
        image: sanj231123/auth-service:v4
        ports:
        - containerPort: 8081
        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"    
