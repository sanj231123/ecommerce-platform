apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        version: v1  
    spec:
      containers:
      - name: order
        image: sanj231123/order-service:v18
        ports:
        - containerPort: 8086
        livenessProbe:
          httpGet:
            path: /health
            port: 8086
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3  

        readinessProbe:
          httpGet:
            path: /health
            port: 8086
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3  
        resources:

          requests:
            cpu: "150m"
            memory: "256Mi"

          limits:
            cpu: "700m"
            memory: "700Mi"  
