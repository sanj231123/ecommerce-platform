apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: ecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
      - name: cart
        image: sanj231123/cart-service:v8
        ports:
        - containerPort: 8085
        resources:

           requests:
             cpu: "100m"
             memory: "128Mi"

           limits:
             cpu: "500m"
             memory: "512Mi"
   
