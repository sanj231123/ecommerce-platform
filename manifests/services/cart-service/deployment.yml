apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: ecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
        version: v1  
    spec:
      containers:
      - name: cart
        image: sanj231123/cart-service:v14
        ports:
        - containerPort: 8085
        livenessProbe:
          httpGet:
            path: /health
            port: 8085
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8085
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3  
        resources:

           requests:
             cpu: "100m"
             memory: "128Mi"

           limits:
             cpu: "500m"
             memory: "512Mi"
   
