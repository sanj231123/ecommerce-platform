apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true" # 🔥 Prevents the TLS/Cert error on health probes
      labels:
        app: api-gateway
        version: v1                                    # 🔥 Feeds data into Kiali for the versioned app graph
    spec:
      containers:
      - name: api-gateway
        image: sanj231123/api-gateway:v18
        imagePullPolicy: IfNotPresent                  # ⚡ Added for stability; forces K8s to pull if missing
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3  
        resources:
          requests:                                    # ⚡ Cleaned up messy spaces here
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
