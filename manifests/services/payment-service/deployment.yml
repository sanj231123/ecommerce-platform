apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service
  namespace: ecom

spec:
  replicas: 1

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service
        version: v1  

    spec:
      containers:

      - name: payment-service

        image: sanj231123/payment-service:v6

        ports:
        - containerPort: 5007
        livenessProbe:
          httpGet:
            path: /health
            port: 5007
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 5007
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3  
        resources:

          requests:
            cpu: "150m"
            memory: "256Mi"

          limits:
            cpu: "700m"
            memory: "700Mi"  

        env:

        - name: PORT
          value: "5007"

        - name: DB_HOST
          value: "mysql"

        - name: DB_USER
          value: "root"

        - name: DB_PASSWORD
          value: "root123"

        - name: DB_NAME
          value: "ecommerce"

        - name: DB_PORT
          value: "3306"

        - name: JWT_SECRET
          value: "secret123"
