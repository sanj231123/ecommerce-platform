apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: payment-service-monitor
  namespace: monitoring

  labels:
    release: monitoring

spec:

  namespaceSelector:
    matchNames:
      - ecom

  selector:
    matchLabels:
      app: payment-service

  endpoints:
  - port: http
    path: /metrics
    interval: 15s
