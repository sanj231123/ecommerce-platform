apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: v1  
    spec:
      containers:
      - name: frontend
        image: sanj231123/frontend:4626b41
        ports:
        - containerPort: 3000
        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits: 
            cpu: "300m"
            memory: "256Mi"   
